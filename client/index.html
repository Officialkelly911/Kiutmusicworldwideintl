<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>Kiut Music Worldwide</title>
    <meta name="description" content="Afro-Caribbean Sound. Global Energy. Stream music, watch videos, and follow the journey of Nigerian-American artist Kiut." />

    <!-- ── Theme color ────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="msapplication-TileColor" content="#0a0a0c" />

    <!-- ── Favicon system ────────────────────────────────────────────── -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Open Graph / social sharing ──────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kiut Music" />
    <meta property="og:description" content="Afro-Caribbean Sound. Global Energy." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Kiut Music Worldwide" />

    <!-- ── Twitter card ──────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kiut Music" />
    <meta name="twitter:description" content="Afro-Caribbean Sound. Global Energy." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- ── Hero media preloads — above-the-fold priority ────────────── -->
    <link rel="preload" as="image" href="/assets/images/hero-poster.jpg" fetchpriority="high" />
    <link rel="preload" as="video" href="/assets/videos/hero-optimized.mp4" type="video/mp4" />

    <!-- ── Fonts ─────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&family=Space+Grotesk:wght@300..700&family=Inter:wght@300..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
