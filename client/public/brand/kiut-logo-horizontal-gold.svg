<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <title>KIUT Music — Horizontal Logo (Gold)</title>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F7E070"/>
      <stop offset="30%"  stop-color="#D4AF37"/>
      <stop offset="65%"  stop-color="#C49A26"/>
      <stop offset="100%" stop-color="#8A6B10"/>
