<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 310" fill="none">
  <title>KIUT Music — Vertical Logo (Gold)</title>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F7E070"/>
      <stop offset="30%"  stop-color="#D4AF37"/>
      <stop offset="65%"  stop-color="#C49A26"/>
      <stop offset="100%" stop-color="#8A6B10"/>
    </linearGradient>
  </defs>
  <!-- Crown mark, centred, scaled to 160×172 -->
  <g transform="translate(20,4) scale(0.8)">
    <polygon points="54,4  64,22  32,210  14,210  44,22"       fill="url(#g)"/>
    <polygon points="146,4  136,22  168,210  186,210  156,22"  fill="url(#g)"/>
    <polygon points="78,6  85,19  159,208  147,208  70,19"     fill="url(#g)"/>
    <polygon points="122,6  130,19  53,208  41,208  115,19"    fill="url(#g)"/>
    <polygon points="100,0  111,28  100,40  89,28"             fill="url(#g)"/>
    <polygon points="100,78  116,106  100,132  84,106"         fill="url(#g)"/>
  </g>
  <!-- Divider -->
  <line x1="60" y1="192" x2="140" y2="192" stroke="#D4AF37" stroke-width="0.75" opacity="0.5"/>
  <!-- KIUT wordmark -->
  <text x="100" y="232"
    text-anchor="middle"
    font-family="'Cinzel', 'Cormorant Garamond', Georgia, serif"
    font-size="30"
    font-weight="300"
    letter-spacing="10"
    fill="url(#g)">KIUT</text>
  <!-- MUSIC secondary — tracking +5% (0.42em ≈ letter-spacing 12.6 at font-size 30) -->
  <text x="100" y="262"
    text-anchor="middle"
    font-family="'Cinzel', 'Cormorant Garamond', Georgia, serif"
    font-size="13"
    font-weight="300"
    letter-spacing="7"
    fill="#D4AF37"
    opacity="0.8">MUSIC</text>
</svg>
