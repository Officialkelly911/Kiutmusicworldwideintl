<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <title>KIUT. — Merchandise Mark</title>
  <!--
    Merchandise version: oversized mark with wordmark stacked below.
    Designed for embroidery, screen printing, and garment applications.
    Use on dark backgrounds only.
  -->
  <!-- K Mark, large, centered -->
  <g transform="translate(150, 40)">
    <rect x="10" y="8" width="18" height="104" rx="1.5" fill="#D4AF37"/>
    <polygon points="28,58 28,37 105,8 105,29" fill="#D4AF37"/>
    <polygon points="28,66 28,87 105,112 105,91" fill="#D4AF37"/>
  </g>
  <!-- Thin rule -->
  <line x1="100" y1="310" x2="300" y2="310" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
  <!-- Wordmark -->
  <text x="200" y="360"
    text-anchor="middle"
    font-family="'Space Grotesk', Inter, Helvetica Neue, sans-serif"
    font-size="40"
    font-weight="300"
    letter-spacing="14"
    fill="#D4AF37">KIUT.</text>
  <!-- Tagline -->
  <text x="200" y="390"
    text-anchor="middle"
    font-family="'Space Grotesk', Inter, Helvetica Neue, sans-serif"
    font-size="10"
    font-weight="300"
    letter-spacing="6"
    fill="#D4AF37"
    opacity="0.55">AFRO-CARIBBEAN SOUND</text>
</svg>
