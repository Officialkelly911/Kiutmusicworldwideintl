<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <title>KIUT. — Social Profile</title>
  <!-- Black background -->
  <rect width="400" height="400" fill="#0A0A0C"/>
  <!-- Subtle gold ambient glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="400" fill="url(#glow)"/>
  <!-- K Mark, centered in 400×400 -->
  <g transform="translate(150, 150)">
    <rect x="10" y="8" width="14" height="84" rx="1" fill="#D4AF37"/>
    <polygon points="24,47 24,30 84,8 84,25" fill="#D4AF37"/>
    <polygon points="24,53 24,70 84,75 84,92" fill="#D4AF37"/>
  </g>
</svg>
